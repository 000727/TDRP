name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Environment smoke test
        run: |
          python - <<'PY'
          from tdrp.envs import EnvConfig, TruckMultiDroneCleanEnv

          env = TruckMultiDroneCleanEnv(EnvConfig(fixed_scale="XS"))
          obs, info = env.reset(seed=0)
          assert env.observation_space.contains(obs)

          mask = obs["action_mask"]
          action = [int(row.nonzero()[0][0]) for row in mask]
          obs, reward, terminated, truncated, info = env.step(action)
          assert env.observation_space.contains(obs)
          print("smoke ok", float(reward), terminated, truncated)
          PY
