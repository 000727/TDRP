[project]
name = "tdrp"
version = "0.1.0"
description = "Vehicle-UAV collaborative path planning under uncertainty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "black>=24.0",
]
analysis = [
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
]
rl = [
    "torch>=2.0",
    "wandb>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tdrp"]

[tool.hatch.build.targets.sdist]
include = ["src/tdrp", "README.md", "pyproject.toml"]

[tool.black]
line-length = 90
target-version = ["py310"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
